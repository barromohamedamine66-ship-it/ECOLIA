<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="slBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="slEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Vibrant Gold -->
    <linearGradient id="slGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Sparkle -->
    <linearGradient id="slCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="slGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Container -->
  <rect width="512" height="512" rx="128" fill="url(#slBg)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#slCyan)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="170" fill="url(#slEmerald)" opacity="0.15" filter="url(#slGlow)" />

  <!-- The SchoolLife Emblem: Stylized Open Book & Graduation Star forming SL -->
  <g transform="translate(0, -10)">
    <!-- Graduation Cap / Diamond Peak -->
    <polygon points="256,105 355,155 256,205 157,155" fill="url(#slGold)" filter="url(#slGlow)" />
    <polygon points="256,120 335,160 256,195 177,160" fill="#fef08a" opacity="0.6" />

    <!-- Cap Tassel -->
    <path d="M 335,165 Q 355,190 350,230" fill="none" stroke="url(#slGold)" stroke-width="6" stroke-linecap="round" />
    <circle cx="350" cy="235" r="7" fill="url(#slGold)" />

    <!-- Open Book Base (Left Wing: S Curve) -->
    <path d="M 244,235 C 190,205 140,225 110,245 C 105,248 100,255 100,262 L 100,360 C 100,368 106,373 114,370 C 145,355 195,340 244,365 Z" fill="url(#slEmerald)" />

    <!-- Open Book Base (Right Wing: L Extension) -->
    <path d="M 268,235 C 322,205 372,225 402,245 C 407,248 412,255 412,262 L 412,360 C 412,368 406,373 398,370 C 367,355 317,340 268,365 Z" fill="url(#slCyan)" />

    <!-- Inner Pages Lines (Left) -->
    <path d="M 125,270 C 160,250 200,250 235,265" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9" />
    <path d="M 125,300 C 160,280 200,280 235,295" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 125,330 C 160,310 200,310 235,325" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7" />

    <!-- Inner Pages Lines (Right) -->
    <path d="M 277,265 C 312,250 352,250 387,270" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9" />
    <path d="M 277,295 C 312,280 352,280 387,300" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 277,325 C 312,310 352,310 387,330" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7" />

    <!-- Book Spine / Central Pillar (Rising Torch) -->
    <rect x="249" y="225" width="14" height="155" rx="7" fill="url(#slGold)" />

    <!-- Central Rising Star / Flame -->
    <circle cx="256" cy="220" r="14" fill="#ffffff" filter="url(#slGlow)" />
  </g>

  <!-- Bottom Subtitle Ribbon -->
  <text x="256" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    SCHOOLLIFE
  </text>
</svg>
