<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Modern Geometric É Stylized Monogram -->
  <g filter="url(#shadow)">
    <!-- Main Vertical Pillar of É -->
    <rect x="140" y="120" width="56" height="272" rx="28" fill="#ffffff" />
    
    <!-- Top Horizontal Bar -->
    <rect x="140" y="120" width="220" height="52" rx="26" fill="#ffffff" />
    
    <!-- Middle Horizontal Bar (Golden Amber Accent) -->
    <rect x="140" y="232" width="170" height="48" rx="24" fill="url(#goldGrad)" />
    
    <!-- Bottom Horizontal Bar -->
    <rect x="140" y="340" width="232" height="52" rx="26" fill="#ffffff" />
    
    <!-- Acute Accent mark on É (Golden Diamond) -->
    <polygon points="270,72 320,72 260,104 220,104" fill="url(#goldGrad)" />
  </g>
</svg>
